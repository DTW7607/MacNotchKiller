name: 问题报告（中文）
description: 报告可复现的显示、窗口选择、输入或兼容性问题
title: "[Bug] "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，没有找到相同问题。
          required: true
        - label: 我已保存目标应用中的重要工作，并了解项目使用私有 macOS API。
          required: true

  - type: input
    attributes:
      label: Mac 型号与芯片
      placeholder: "例如 MacBook Pro 14-inch, M4 Pro"
    validations:
      required: true

  - type: input
    attributes:
      label: macOS 版本
      placeholder: "例如 macOS 26.5.1"
    validations:
      required: true

  - type: input
    attributes:
      label: 目标应用
      placeholder: 应用名称与版本
    validations:
      required: true

  - type: dropdown
    attributes:
      label: 辅助功能权限
      options:
        - 已授权
        - 未授权
        - 不确定
    validations:
      required: true

  - type: textarea
    attributes:
      label: 复现步骤
      placeholder: 请按顺序描述从启动 MacNotchKiller 到问题出现的操作。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    attributes:
      label: 实际行为与完整错误文本
    validations:
      required: true

  - type: textarea
    attributes:
      label: 显示器环境与补充日志
      description: 请说明外接显示器数量、排列方式，并粘贴终端日志。
      render: shell
